<script>
"use strict";
// ===PURE-START===（纯逻辑：解析、校验、标定，可独立测试）
const WIN_S = 556 / 117; // 怪从出现到过线的窗口（秒）≈4.75
const TIERS = { "弱": 35, "中": 48, "强": 58, "Boss": 68, "boss": 68 };
function applyOp(p, op) {
  let r = p;
  if (op[0] === "+") r = p + op[1]; else if (op[0] === "-") r = p - op[1];
  else if (op[0] === "×") r = p * op[1]; else if (op[0] === "÷") r = Math.floor(p / op[1]);
  return Math.max(0, Math.min(999999, r));
}
function streamsOf(p) { return Math.min(7, 1 + Math.floor(p / 15)); }
function dmgOf(p) { return 1 + Math.floor(p / 90); }
function dpsOf(p) { return streamsOf(p) * dmgOf(p) / 0.12; }
function normOp(ch) { return ch === "*" || ch === "x" || ch === "X" ? "×" : ch === "/" ? "÷" : ch; }

const HEADER_KEYS = { "标题": "title", "怪名": "mname", "怪样": "emoji", "队名": "sname", "胜句": "win", "败句": "fail" };
function parseLevel(text) {
  const steps = [], errors = [], theme = {};
  const lines = String(text).split(/\n/);
  lines.forEach((raw, i) => {
    const lineNo = i + 1, s = raw.trim();
    if (!s || s.startsWith("#")) return;
    let m = s.match(/^(标题|怪名|怪样|队名|胜句|败句)[:：](.+)$/);
    if (m) { theme[HEADER_KEYS[m[1]]] = m[2].trim(); return; }
    m = s.match(/^同刻[:：]\s*怪\s*强度\s*(弱|中|强|Boss|boss|\d+(?:\.\d+)?\s*%?)\s*[|｜]\s*门\s*左\s*([+\-×÷*xX/])\s*(\d+)\s*[|｜]\s*右\s*([+\-×÷*xX/])\s*(\d+)$/);
    if (m) {
      const t = m[1].replace(/\s|%/g, "");
      const pct = TIERS[m[1].trim()] !== undefined ? TIERS[m[1].trim()] : parseFloat(t);
      steps.push({ type: "pair", pct, left: [normOp(m[2]), +m[3]], right: [normOp(m[4]), +m[5]], line: lineNo });
      return;
    }
    m = s.match(/^门[:：]\s*左\s*([+\-×÷*xX/])\s*(\d+)\s*[|｜]\s*右\s*([+\-×÷*xX/])\s*(\d+)$/);
    if (m) { steps.push({ type: "gate", left: [normOp(m[1]), +m[2]], right: [normOp(m[3]), +m[4]], line: lineNo }); return; }
    m = s.match(/^道具门[:：]\s*([+\-])\s*(\d+)$/);
    if (m) { steps.push({ type: "item", op: [m[1], +m[2]], line: lineNo }); return; }
    m = s.match(/^怪[:：]\s*强度\s*(弱|中|强|Boss|boss|\d+(?:\.\d+)?\s*%?)\s*(?:[|｜]\s*(护盾|分裂))?$/);
    if (m) {
      const t = m[1].replace(/\s|%/g, "");
      const pct = TIERS[m[1].trim()] !== undefined ? TIERS[m[1].trim()] : parseFloat(t);
      steps.push({ type: "enemy", pct, part: m[2] || null, line: lineNo });
      return;
    }
    errors.push("第 " + lineNo + " 行看不懂：\u201C" + s.slice(0, 24) + "\u201D");
  });
  return { steps, errors, theme };
}

function buildLevel(parsed, sandbox) {
  const errors = [...parsed.errors], warnings = [];
  const steps = parsed.steps;
  if (!steps.length) errors.push("关卡文件是空的。");
  // 运算合法性
  for (const s of steps) {
    const ops = (s.type === "gate" || s.type === "pair") ? [s.left, s.right] : s.type === "item" ? [s.op] : [];
    for (const op of ops) {
      if (!sandbox && op[0] === "×" && ![2, 3].includes(op[1])) errors.push("第 " + s.line + " 行：× 只许 2 或 3，你写了 ×" + op[1] + "。");
      if (!sandbox && op[0] === "÷" && op[1] !== 2) errors.push("第 " + s.line + " 行：÷ 只许 ÷2，你写了 ÷" + op[1] + "。");
    }
    if ((s.type === "enemy" || s.type === "pair") && !sandbox && (s.pct < 35 || s.pct > 70)) errors.push("第 " + s.line + " 行：强度必须在 35% 到 70% 之间，你写了 " + s.pct + "%。");
  }
  if (!sandbox && (steps.length < 12 || steps.length > 24)) errors.push("总步数要在 12 到 24 步之间，你现在是 " + steps.length + " 步。");
  const enemies = steps.filter(s => s.type === "enemy" || s.type === "pair");
  if (!sandbox && enemies.length && enemies[0].pct > 48) errors.push("第一只怪太强了（" + enemies[0].pct + "%）：先让玩家上手，第一只只能是弱或中。");
  steps.forEach((s, idx) => { if (s.type === "pair" && idx < 2) errors.push("第 " + s.line + " 行：双线事件（同刻）太靠前了——先让玩家学会单线，前两步不许用。"); });
  if (!sandbox) { // 连续负向门
    let streak = 0;
    for (const s of steps) {
      const neg = (s.type === "gate" || s.type === "pair") && ["-", "÷"].includes(s.left[0]) && ["-", "÷"].includes(s.right[0]);
      streak = neg ? streak + 1 : 0;
      if (streak >= 3) { errors.push("第 " + s.line + " 行附近：连续 3 道以上的坑门，玩家会喘不过气。"); break; }
    }
  }
  // 双路模拟：死路检查 + 标定（血量按最优路线的火力换算）
  function simulate(pickBetter) {
    let power = 3; const built = [];
    for (const s of steps) {
      if (s.type === "gate") {
        const a = applyOp(power, s.left), b = applyOp(power, s.right);
        if (a <= 0 || b <= 0) errors.push("第 " + s.line + " 行是死路门：有一边算完人数会变成 0 或负数。");
        power = pickBetter ? Math.max(a, b) : Math.min(a, b);
        built.push({ type: "gate", left: s.left, right: s.right });
      } else if (s.type === "item") {
        const a = applyOp(power, s.op);
        if (a <= 0) errors.push("第 " + s.line + " 行道具门会让人数变成 0 或负数。");
        power = a; built.push({ type: "item", op: s.op });
      } else if (s.type === "pair") {
        const a = applyOp(power, s.left), b = applyOp(power, s.right);
        if (a <= 0 || b <= 0) errors.push("第 " + s.line + " 行（双线）是死路门：有一边算完人数会变成 0 或负数。");
        const hp = Math.max(4, Math.round(dpsOf(power) * WIN_S * s.pct / 100));
        built.push({ type: "pair", hp, left: s.left, right: s.right });
        power = pickBetter ? Math.max(a, b) : Math.min(a, b);
      } else {
        // 零件算在总血量预算之内：护盾/分裂只改变打法与样子，不额外加总量（否则 Boss+护盾会顶到窗口 95%、全对路线也打不死）
        const budget = Math.max(4, Math.round(dpsOf(power) * WIN_S * s.pct / 100));
        let hp = budget, shield = 0, splitHp = 0;
        if (s.part === "护盾") { shield = Math.round(budget * 0.3); hp = budget - shield; }
        if (s.part === "分裂") { hp = Math.round(budget * 0.7); splitHp = Math.round(budget * 0.15); }
        built.push({ type: "enemy", hp, shield, split: s.part === "分裂", splitHp });
        if (!pickBetter) { /* 最差路线不推进人数（怪只会扣血），保持 power 不变近似 */ }
      }
      if (power <= 0) break;
    }
    return { power, built };
  }
  const opt = simulate(true), worst = simulate(false);
  // 全错路线漏怪数（built 与 steps 一一对齐；双线怪窗口更长，这里按普通窗口保守估）
  let wPower = 3, leaks = 0;
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i], b = opt.built[i];
    if (s.type === "gate" || s.type === "pair") { if (dpsOf(wPower) * WIN_S < (b.hp || 0) && s.type === "pair") leaks++; wPower = Math.min(applyOp(wPower, s.left), applyOp(wPower, s.right)); }
    else if (s.type === "item") wPower = applyOp(wPower, s.op);
    else if (dpsOf(wPower) * WIN_S < b.hp) leaks++;
  }
  if (!enemies.some(e => e.pct >= 68)) warnings.push("整关没有 Boss，结尾可能不够带劲——考虑放一只压轴的。");
  if (leaks < 2) warnings.push("按全选错来玩，只漏 " + leaks + " 只怪——这关坑不住人，选对选错差别不大。");
  if (opt.power < 90) warnings.push("全选对最后也只有 " + opt.power + " 人，长不大，后面会没劲——把门的数字给大方一点。");
  const errs = [...new Set(errors)]; // 两路模拟会重复报告同一处死路，去重
  return { ok: errs.length === 0, errors: errs, warnings, script: opt.built, optFinal: opt.power, worstLeaks: leaks };
}
// ===PURE-END===
</script>
<script>
"use strict";
// —— 引擎（封版 v10 逻辑 + 零件） ——
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const W = 480, H = 620, PLAYER_Y = H - 84, GAME_LEN = 90;
function fmt(n) { return n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + "万" : String(Math.max(0, Math.round(n))); }
let theme = { title: "激光数字门", emoji: "👾", mname: "数字怪", sname: "激光小队", win: "到达终点！", fail: "小队被冲散了……", bg: "", mimg: "", pimg: "" };
const skinImgs = {};
function loadSkin() {
  for (const k of ["bg", "mimg", "pimg"]) {
    const url = (theme[k] || "").trim();
    if (url) { const im = new Image(); im.src = url; skinImgs[k] = im; } else delete skinImgs[k];
  }
}
function drawCover(img, x, y, w, h) {
  const ir = img.naturalWidth / img.naturalHeight, r = w / h;
  let sw, sh, sx, sy;
  if (ir > r) { sh = img.naturalHeight; sw = sh * r; sx = (img.naturalWidth - sw) / 2; sy = 0; }
  else { sw = img.naturalWidth; sh = sw / r; sx = 0; sy = (img.naturalHeight - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function imgReady(k) { const im = skinImgs[k]; return im && im.complete && im.naturalWidth > 0; }
let script = null; // 装配后的剧本
let power = 3, kills = 0, running = false, raf = null;
let bullets = [], enemies = [], gates = [], floats = [];
let px = W / 2, targetX = W / 2, stepIdx = 0, nextStepAt = 0, lastShot = 0, startTime = 0, lastFrame = 0, pendingSpawns = [];
function opLabel(op) { return (op[0] === "+" ? "+" : op[0] === "-" ? "−" : op[0]) + op[1]; }

function spawnStep(now) {
  if (!script || stepIdx >= script.length) { nextStepAt = now + 999999; return; }
  const s = script[stepIdx];
  if (s.type === "gate") gates.push({ y: -52, left: s.left, right: s.right, applied: false, item: false });
  else if (s.type === "item") gates.push({ y: -52, left: s.op, right: s.op, applied: false, item: true });
  else if (s.type === "pair") {
    // 双线事件：怪先出（且走得慢，窗口更长），0.9 秒后门跟着落下——玩家要一边打怪一边抽空去穿门
    const side = Math.random() < 0.5 ? "L" : "R";
    const center = side === "L" ? W / 4 : W * 3 / 4;
    enemies.push({ x: center + (Math.random() * 90 - 45), y: -60, w: 92, h: 56, hp: s.hp, maxHp: s.hp, shield: 0, split: false, mini: false, flash: 0, resolved: false, speedMul: 0.85 });
    pendingSpawns.push({ at: now + 550, fn: () => gates.push({ y: -52, left: s.left, right: s.right, applied: false, item: false }) });
  }
  else {
    const side = Math.random() < 0.5 ? "L" : "R";
    const center = side === "L" ? W / 4 : W * 3 / 4;
    enemies.push({ x: center + (Math.random() * 90 - 45), y: -60, w: 92, h: 56, hp: s.hp, maxHp: s.hp, shield: s.shield || 0, split: !!s.split, splitHp: s.splitHp || 0, mini: false, flash: 0, resolved: false });
  }
  const wait = (s.type === "enemy" || s.type === "pair") ? 2800 : 1500;
  nextStepAt = now + wait; stepIdx++;
}

function loop(now) {
  if (!running) return;
  const dt = Math.min(0.05, lastFrame ? (now - lastFrame) / 1000 : 1 / 60); lastFrame = now;
  const elapsed = (now - startTime) / 1000;
  document.getElementById("time").textContent = Math.floor(elapsed);
  document.getElementById("prog").style.width = Math.min(100, elapsed / GAME_LEN * 100) + "%";
  document.getElementById("streams").textContent = streamsOf(power);
  if (elapsed >= GAME_LEN) return finish(true);
  // 剧本打完且场上清空 = 提前通关，不陪 90 秒空转（孩子的关卡长短不一，以剧本走完为准，90 秒只是上限）
  if (script && stepIdx >= script.length && enemies.length === 0 && gates.length === 0 && pendingSpawns.length === 0 && elapsed > 3) return finish(true);
  while (pendingSpawns.length && now >= pendingSpawns[0].at) pendingSpawns.shift().fn();
  if (now >= nextStepAt) {
    const s = script && script[stepIdx];
    if (s) {
      const gatePending = gates.some(g => !g.applied);
      const enemyBlocked = (s.type === "enemy" || s.type === "pair") && (gatePending || (elapsed < 32 && enemies.length > 0));
      const gateBlocked = (s.type === "gate" || s.type === "item") && (enemies.length > 0 || gatePending);
      if (!enemyBlocked && !gateBlocked) spawnStep(now);
    }
  }
  const scroll = 117 * dt;
  px += (targetX - px) * (1 - Math.pow(0.65, dt * 60));
  if (now - lastShot > 120) {
    const n = streamsOf(power), dmg = dmgOf(power);
    const spread = Math.min(88, (n - 1) * 15);
    for (let i = 0; i < n; i++) { const off = n === 1 ? 0 : -spread / 2 + spread * (i / (n - 1)); bullets.push({ x: px + off, y: PLAYER_Y - 34, dmg }); }
    lastShot = now;
  }
  for (const b of bullets) b.y -= 540 * dt;
  bullets = bullets.filter(b => b.y > -12);
  for (const e of enemies) { e.y += scroll * (e.speedMul || 1); if (e.flash > 0) e.flash -= dt; }
  for (const g of gates) g.y += 175 * dt;
  for (const b of bullets) {
    let hit = null;
    for (const e of enemies) {
      if (Math.abs(b.x - e.x) < e.w / 2 + 10 && b.y < e.y + e.h / 2 && b.y > e.y - e.h / 2) { if (!hit || e.y > hit.y) hit = e; }
    }
    if (hit) {
      let d = b.dmg; hit.flash = 0.05; b.y = -999;
      if (hit.shield > 0) { const s = Math.min(hit.shield, d); hit.shield -= s; d -= s; }
      hit.hp -= d;
      if (hit.hp <= 0) {
        kills++; document.getElementById("kills").textContent = kills;
        if (hit.split && !hit.mini) {
          for (const sgn of [-1, 1]) { const chp = Math.max(3, hit.splitHp || Math.round(hit.maxHp * 0.3)); enemies.push({ x: Math.max(40, Math.min(W - 40, hit.x + sgn * 44)), y: hit.y, w: 64, h: 44, hp: chp, maxHp: chp, shield: 0, split: false, mini: true, flash: 0, resolved: false }); }
          addFloat(hit.x, hit.y, "分裂了！", "#ffd43b");
        } else addFloat(hit.x, hit.y, "击破！", "#51cf66");
        enemies = enemies.filter(e => e !== hit);
      }
    }
  }
  bullets = bullets.filter(b => b.y > -100);
  for (const g of gates) {
    if (!g.applied && g.y + 46 >= PLAYER_Y - 10) {
      g.applied = true;
      const op = px < W / 2 ? g.left : g.right, before = power;
      power = applyOp(power, op);
      document.getElementById("power").textContent = fmt(power);
      addFloat(px, PLAYER_Y - 82, opLabel(op) + " → " + fmt(power), power >= before ? "#51cf66" : "#ff8787");
      if (power <= 0) return finish(false);
    }
  }
  gates = gates.filter(g => g.y < H + 60);
  for (const e of enemies) {
    if (!e.resolved && e.y + e.h / 2 >= PLAYER_Y - 12) {
      e.resolved = true;
      const bite = e.hp + e.shield;
      power -= bite;
      document.getElementById("power").textContent = fmt(Math.max(0, power));
      addFloat(px, PLAYER_Y - 82, "被冲过去 -" + fmt(bite), "#ff8787");
      e.y = H + 200;
      if (power <= 0) return finish(false);
    }
  }
  enemies = enemies.filter(e => e.y < H + 60);
  for (const f of floats) { f.y -= 48 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
  draw(now);
  raf = requestAnimationFrame(loop);
}
function addFloat(x, y, text, color) { floats.push({ x, y, text, color, life: 0.9 }); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function drawGate(x, y, w, op, item) {
  ctx.fillStyle = item ? "rgba(255,212,59,.85)" : (op[0] === "+" || op[0] === "×" ? "rgba(81,207,102,.85)" : "rgba(255,135,135,.85)");
  rr(x + 3, y, w - 6, 46, 9); ctx.fill();
  ctx.fillStyle = "#14161f"; ctx.font = "bold 21px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(opLabel(op), x + w / 2, y + 24);
}
function draw(now) {
  ctx.clearRect(0, 0, W, H);
  if (imgReady("bg")) { drawCover(skinImgs.bg, 0, 0, W, H); ctx.fillStyle = "rgba(20,22,31,.52)"; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = "rgba(255,255,255,.05)"; ctx.fillRect(W / 2 - 1, 0, 2, H);
  for (const g of gates) { drawGate(0, g.y, W / 2, g.left, g.item); drawGate(W / 2, g.y, W / 2, g.right, g.item); }
  for (const e of enemies) {
    ctx.fillStyle = e.flash > 0 ? "#ff8787" : "#845ef7";
    rr(e.x - e.w / 2, e.y - e.h / 2, e.w, e.h, 12); ctx.fill();
    if (e.resolved) ctx.globalAlpha = 0.45;
    if (imgReady("mimg")) {
      ctx.save(); ctx.beginPath(); ctx.arc(e.x, e.y, e.w * 0.34, 0, Math.PI * 2); ctx.clip();
      drawCover(skinImgs.mimg, e.x - e.w * 0.34, e.y - e.w * 0.34, e.w * 0.68, e.w * 0.68); ctx.restore();
    } else {
      ctx.font = (e.mini ? 21 : 30) + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillText(theme.emoji, e.x, e.y + 6);
    }
    ctx.fillStyle = "#fff"; ctx.font = "bold " + (e.mini ? 20 : 27) + "px sans-serif"; ctx.textBaseline = "top";
    ctx.fillText(fmt(Math.max(0, e.hp)), e.x, e.y - e.h / 2 + 2);
    if (e.shield > 0) { ctx.fillStyle = "#66d9e8"; ctx.font = "bold 13px sans-serif"; ctx.fillText("🛡" + fmt(e.shield), e.x, e.y - e.h / 2 - 15); }
    if (e.split && !e.mini) { ctx.fillStyle = "#ffd43b"; ctx.font = "bold 12px sans-serif"; ctx.fillText("分裂", e.x, e.y + e.h / 2 - 13); }
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#66d9e8";
  for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 9, 4, 13);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const mates = Math.min(4, Math.floor(power / 8));
  ctx.font = "26px serif";
  for (let i = 0; i < mates; i++) ctx.fillText("🧑", px + (i - (mates - 1) / 2) * 24, PLAYER_Y + 22);
  if (imgReady("pimg")) {
    ctx.save(); ctx.beginPath(); ctx.arc(px, PLAYER_Y, 19, 0, Math.PI * 2); ctx.clip();
    drawCover(skinImgs.pimg, px - 19, PLAYER_Y - 19, 38, 38); ctx.restore();
    ctx.strokeStyle = "#ffd43b"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, PLAYER_Y, 19, 0, Math.PI * 2); ctx.stroke();
  } else { ctx.font = "32px serif"; ctx.fillText("🧑‍🚀", px, PLAYER_Y); }
  const pwLabel = fmt(power);
  ctx.font = "bold 19px sans-serif";
  const pwW = ctx.measureText(pwLabel).width;
  ctx.fillStyle = "#ffd43b";
  rr(px - pwW / 2 - 9, PLAYER_Y - 41, pwW + 18, 30, 15); ctx.fill();
  ctx.fillStyle = "#212529";
  ctx.fillText(pwLabel, px, PLAYER_Y - 25);
  ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.font = "12px sans-serif";
  ctx.fillText(theme.sname, px, PLAYER_Y + 44);
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 1.6); ctx.fillStyle = f.color; ctx.font = "bold 17px sans-serif"; ctx.fillText(f.text, f.x, f.y); ctx.globalAlpha = 1; }
}
function finish(win) {
  running = false; if (raf) cancelAnimationFrame(raf);
  const used = Math.floor((performance.now() - startTime) / 1000);
  document.getElementById("endmsg").textContent = win ? "🏁 " + theme.win + "（用时 " + used + " 秒，最终人数 " + fmt(power) + "，击破 " + kills + " 只" + theme.mname + "）" : "💥 " + theme.fail;
  draw(performance.now());
}
function startGame() {
  if (!script) { document.getElementById("endmsg").textContent = "先在左边装配一个关卡！"; return; }
  power = 3; kills = 0; bullets = []; enemies = []; gates = []; floats = []; pendingSpawns = [];
  px = targetX = W / 2; stepIdx = 0; lastShot = 0; lastFrame = 0;
  document.getElementById("power").textContent = "3";
  document.getElementById("kills").textContent = "0";
  document.getElementById("endmsg").textContent = "";
  running = true; startTime = performance.now(); nextStepAt = startTime + 500;
  raf = requestAnimationFrame(loop);
}
cv.addEventListener("pointermove", e => { const r = cv.getBoundingClientRect(); targetX = Math.max(24, Math.min(W - 24, (e.clientX - r.left) * W / r.width)); });
cv.addEventListener("pointerdown", e => { const r = cv.getBoundingClientRect(); targetX = Math.max(24, Math.min(W - 24, (e.clientX - r.left) * W / r.width)); });
document.getElementById("b_start").onclick = startGame;

function readTheme() {
  return { title: document.getElementById("t_title").value || "激光数字门", emoji: document.getElementById("t_emoji").value || "👾", mname: document.getElementById("t_mname").value || "数字怪", sname: document.getElementById("t_sname").value || "激光小队", win: document.getElementById("t_win").value || "到达终点！", fail: document.getElementById("t_fail").value || "小队被冲散了……", bg: document.getElementById("t_bg").value.trim(), mimg: document.getElementById("t_mimg").value.trim(), pimg: document.getElementById("t_pimg").value.trim() };
}
function writeTheme(t) {
  if (!t) return;
  document.getElementById("t_title").value = t.title || ""; document.getElementById("t_emoji").value = t.emoji || "";
  document.getElementById("t_mname").value = t.mname || ""; document.getElementById("t_sname").value = t.sname || "";
  document.getElementById("t_win").value = t.win || ""; document.getElementById("t_fail").value = t.fail || "";
  document.getElementById("t_bg").value = t.bg || ""; document.getElementById("t_mimg").value = t.mimg || ""; document.getElementById("t_pimg").value = t.pimg || "";
}
function doBuild(sandbox) {
  const parsed = parseLevel(document.getElementById("level").value);
  // 文件头部的主题行（标题：/怪名：等）优先：工程师把主题和剧本写在一个文件里交回来
  const tmap = { title: "t_title", emoji: "t_emoji", mname: "t_mname", sname: "t_sname", win: "t_win", fail: "t_fail" };
  for (const k in (parsed.theme || {})) if (tmap[k]) document.getElementById(tmap[k]).value = parsed.theme[k];
  theme = readTheme(); loadSkin();
  document.getElementById("gametitle").textContent = theme.title;
  const r = buildLevel(parsed, sandbox);
  const rep = document.getElementById("report");
  if (r.ok) {
    script = r.script;
    let html = '<span class="ok">✔ 装配成功' + (sandbox ? "（沙盒模式：放开了强度和门的限制）" : "") + '</span>\n全选对路线：最终 ' + fmt(r.optFinal) + ' 人；全选错路线：会漏 ' + r.worstLeaks + ' 只怪。';
    if (r.warnings.length) html += '\n<span class="soft">提醒（可以不听）：</span>\n' + r.warnings.map(w => "· " + w).join("\n");
    rep.innerHTML = html;
  } else {
    script = null;
    rep.innerHTML = '<span class="err">✘ 装配被拦下了：</span>\n' + r.errors.map(e => "· " + e).join("\n") + '\n把这几句原样发给工程师，它会改好再给你。';
  }
  draw(performance.now());
}
